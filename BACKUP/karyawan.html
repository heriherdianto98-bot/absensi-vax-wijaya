<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Karyawan - Vax Wijaya</title>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }
    
    body{
        display:flex;
        background:#111;
        color:white;
    }
    
    .sidebar{
        width:250px;
        height:100vh;
        background:#1b1b1b;
        padding:20px;
    }
    
    .sidebar h2{
        color:gold;
        margin-bottom:30px;
    }
    
    .sidebar a{
        display:block;
        color:white;
        text-decoration:none;
        padding:12px;
        border-radius:8px;
        margin-bottom:10px;
    }
    
    .sidebar a:hover{
        background:gold;
        color:black;
    }
    
    .content{
        flex:1;
        padding:30px;
    }
    
    h1{
        color:gold;
    }
    .cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:30px;
}
table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #333;
    text-align:left;
}

th{
    color:gold;
}

button{
    background:gold;
    color:black;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}
.card{
background:#1f1f1f;
padding:20px;
border-radius:12px;
border:1px solid #333;
}

.card h3{
color:#ccc;
margin-bottom:15px;
font-size:16px;
}

.card h2{
color:gold;
font-size:32px;
}
/* Form */
input,
select{
    width:100%;
    padding:10px;
    background:#111;
    color:#fff;
    border:1px solid #555;
    border-radius:8px;
    font-size:15px;
}

input:focus,
select:focus{
    outline:none;
    border-color:gold;
}

select option{
    background:#1f1f1f;
    color:#fff;
}
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>VAX WIJAYA</h2>
    
        <a href="dashboard.html">🏠 Dashboard</a>
<a href="karyawan.html">👤 Karyawan</a>
<a href="cabang.html">🏢 Cabang</a>
<a href="pengaturan.html">⚙ Pengaturan</a>
<a href="laporan.html">📊 Laporan</a>
        <button id="logout" style="
width:100%;
margin-top:20px;
padding:12px;
background:#dc3545;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
">
Logout
</button>
    </div>
    
    
    <div class="content">

        <h1>Karyawan</h1>
    
        <div class="card" style="margin-top:20px;">
    
            <div style="
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
">

    <button id="btnTambah">
        + Tambah Karyawan
    </button>

    <input
        type="text"
        id="cariNama"
        placeholder="🔍 Cari nama..."
        style="
        width:250px;
        ">
</div>

<div style="
display:flex;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
">

    <select id="filterCabang">
        <option value="">Semua Cabang</option>
    </select>

    <select id="filterJabatan">
        <option value="">Semua Jabatan</option>
        <option>Capster</option>
        <option>Kasir</option>
        <option>SVP</option>
        <option>Owner</option>
    </select>

    <select id="filterStatus">
        <option value="">Semua Status</option>
        <option>Aktif</option>
        <option>Nonaktif</option>
    </select>

    <button id="resetFilter">
        Reset
    </button>

</div>
    
            <table width="100%" id="tabelKaryawan">
    
                <thead>
                    <tr>
                        <th>Nama</th>
                        <th>Cabang</th>
                        <th>Jabatan</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
    
                <tbody>
    
                </tbody>
    
            </table>
    
        </div>
    
    </div>
   
<!-- Popup Tambah Karyawan -->
<div id="modalTambah" style="
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
justify-content:center;
align-items:center;
">

<div style="
background:#1f1f1f;
padding:25px;
border-radius:12px;
width:400px;
">

<h2 style="color:gold;margin-bottom:20px;">
Tambah Karyawan
</h2>

<label>Nama</label><br><button id="btnTambah">
<input id="nama"><br><br>

<label>Cabang</label><br>
<select id="cabang"></select><br><br>

<label>Jabatan</label><br>
<select id="jabatan" style="width:100%;padding:10px;">
<option>Capster</option>
<option>Kasir</option>
<option>SVP</option>
<option>Owner</option>
</select><br><br>

<label>Status</label><br>
<select id="status" style="width:100%;padding:10px;">
<option>Aktif</option>
<option>Nonaktif</option>
</select><br><br>

<button id="simpanKaryawan">
Simpan
</button>

<button id="batalTambah"
style="background:#666;color:white;">
Batal
</button>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="karyawan.js"></script>
</body>
</html>
