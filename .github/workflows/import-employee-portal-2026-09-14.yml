name: Import approved employee portal baseline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  import-portal:
    if: github.head_ref == 'import/employee-portal-2026-09-14'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fetch approved portal baseline only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/employee-portal-src
          git clone --depth 1 --branch baseline/employee-portal-2026-09-14 \
            https://github.com/heriherdianto98-bot/absensi-vax-wijaya.git \
            /tmp/employee-portal-src

          files=(
            "absensi.html"
            "dashboard-karyawan.css"
            "dashboard-karyawan.html"
            "dashboard-karyawan.js"
            "gaji-saya.css"
            "gaji-saya.html"
            "gaji-saya.js"
            "gaji-saya-calendar.css"
            "gaji-saya-calendar.js"
            "karyawan-session.js"
            "pengumuman.css"
            "pengumuman.html"
            "pengumuman.js"
            "riwayat.css"
            "riwayat.html"
            "riwayat.js"
            "ERP.NEW/assets/brand/erp-vax-wijaya.png"
          )

          for f in "${files[@]}"; do
            test -f "/tmp/employee-portal-src/$f"
            mkdir -p "$(dirname "$f")"
            cp -f "/tmp/employee-portal-src/$f" "$f"
          done

          rm -f ERP.NEW/PORTAL_IMPORT_REQUEST_2026-09-14.md

      - name: Commit only approved portal files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ERP VAX Canonical Import"
          git config user.email "actions@github.com"

          git add -- \
            absensi.html \
            dashboard-karyawan.css \
            dashboard-karyawan.html \
            dashboard-karyawan.js \
            gaji-saya.css \
            gaji-saya.html \
            gaji-saya.js \
            gaji-saya-calendar.css \
            gaji-saya-calendar.js \
            karyawan-session.js \
            pengumuman.css \
            pengumuman.html \
            pengumuman.js \
            riwayat.css \
            riwayat.html \
            riwayat.js \
            ERP.NEW/assets/brand/erp-vax-wijaya.png \
            ERP.NEW/PORTAL_IMPORT_REQUEST_2026-09-14.md

          if git diff --cached --quiet; then
            echo "Canonical import branch already matches approved portal baseline."
            exit 0
          fi

          git commit -m "Import approved employee portal baseline into canonical ERP-VAX"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
