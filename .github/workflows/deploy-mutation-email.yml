name: Deploy Mutation Email API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-mutation-email.yml"
      - "notification-service/monthly-report-email-api.js"
      - "notification-service/deploy/nginx-monthly-report-email.conf"

concurrency:
  group: erp-vax-mutation-email-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_erp_vax_deploy
          chmod 600 ~/.ssh/id_erp_vax_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload API
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          KEY="$HOME/.ssh/id_erp_vax_deploy"
          scp -i "$KEY" notification-service/monthly-report-email-api.js "$VPS_USER@$VPS_HOST:/tmp/monthly-report-email-api.js"
          ssh -i "$KEY" "$VPS_USER@$VPS_HOST" '
            set -e
            node --check /tmp/monthly-report-email-api.js
            cp -p /opt/erp-vax-notification/monthly-report-email-api.js /opt/erp-vax-notification/monthly-report-email-api.js.bak-mutation-email
            install -m 644 /tmp/monthly-report-email-api.js /opt/erp-vax-notification/monthly-report-email-api.js
            systemctl restart erp-vax-monthly-report-email
            sleep 2
            systemctl is-active --quiet erp-vax-monthly-report-email
            curl -fsS --max-time 5 http://127.0.0.1:8795/health
          '

      - name: Add Nginx mutation route
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          KEY="$HOME/.ssh/id_erp_vax_deploy"
          ssh -i "$KEY" "$VPS_USER@$VPS_HOST" 'python3 -' <<'PY'
          from pathlib import Path
          import subprocess, sys, time
          p=Path("/etc/nginx/sites-enabled/erp-vax")
          s=p.read_text()
          route='''location = /api/arus-kas/mutation/email-svp {
              client_max_body_size 2m;
              proxy_pass http://127.0.0.1:8795/api/arus-kas/mutation/email-svp;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header Authorization $http_authorization;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_connect_timeout 10s;
              proxy_read_timeout 90s;
          }
          '''
          marker='location = /api/monthly-report/health {'
          if '/api/arus-kas/mutation/email-svp' not in s:
              if marker not in s:
                  raise SystemExit("monthly report health marker not found; refusing nginx edit")
              backup=Path("/root/erp-vax-nginx-before-mutation-email-"+time.strftime("%Y%m%d-%H%M%S"))
              backup.write_text(s)
              p.write_text(s.replace(marker,route+marker,1))
          test=subprocess.run(["nginx","-t"],capture_output=True,text=True)
          print(test.stdout)
          print(test.stderr)
          if test.returncode:
              raise SystemExit("nginx test failed")
          PY
          ssh -i "$KEY" "$VPS_USER@$VPS_HOST" '
            set -e
            systemctl reload nginx
            nginx -T 2>&1 | grep -q "/api/arus-kas/mutation/email-svp"
            curl -fsS --max-time 10 --resolve erp.vaxwijaya.com:443:127.0.0.1 https://erp.vaxwijaya.com/api/monthly-report/health
            echo
            echo MUTATION_EMAIL_DEPLOY_OK
          '
