name: Fix Arus Kas Empty State

on:
  push:
    branches: [fix/arus-kas-clean]
    paths: [.github/workflows/fix-arus-kas-empty-state.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/arus-kas-clean
          fetch-depth: 0

      - name: Patch only empty-state visibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ERP.NEW/js/modules/arus-kas.js')
          s = p.read_text(encoding='utf-8')
          old1 = '''            if(empty){
                empty.hidden = false;
                empty.textContent = "Tidak ada baris ledger pada filter aktif.";
            }'''
          new1 = '''            if(empty){
                empty.hidden = false;
                empty.style.removeProperty("display");
                empty.textContent = "Tidak ada baris ledger pada filter aktif.";
            }'''
          old2 = '''        if(empty) empty.hidden = true;
        if(table) table.hidden = false;'''
          new2 = '''        if(empty){
            empty.hidden = true;
            empty.style.setProperty("display", "none", "important");
        }
        if(table) table.hidden = false;'''
          if old1 not in s or old2 not in s:
              raise SystemExit('Expected render blocks not found; aborting safely')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Syntax check
        run: node --check ERP.NEW/js/modules/arus-kas.js

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "vax-erp-bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/fix-arus-kas-empty-state.yml
          git add ERP.NEW/js/modules/arus-kas.js .github/workflows/fix-arus-kas-empty-state.yml
          git commit -m "fix: hide empty state when arus kas has ledger rows"
          git push origin HEAD:fix/arus-kas-clean
