name: One-time patch TRX source to Daily Recap

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch sync.js only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('minutes-connector/sync.js')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r"  const salesSummaryTransaction =\n.*?\n  const customerMinutes = Number\(",
              re.S,
          )

          replacement = '''  // OWNER PASS rule 2026-09-05:
          // TRANSACTION canonical wajib mengikuti angka TRANSACTION resmi
          // pada Daily Recap Minutes. Customer/Guest adalah visitor breakdown,
          // bukan rumus jumlah transaksi; satu visitor bisa membuat >1 transaksi
          // (mis. transaksi produk/minuman terpisah).
          const transactionMinutes =
            dailyRecapTransactionMinutes;

          console.log(
            `TRX Daily Recap canonical = ${transactionMinutes}`
          );
          const customerMinutes = Number('''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Target block count={count}; abort tanpa perubahan.')

          path.write_text(updated, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        shell: bash
        run: rm -f .github/workflows/patch-trx-daily-recap-once.yml

      - name: Commit canonical TRX fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minutes-connector/sync.js .github/workflows/patch-trx-daily-recap-once.yml
          git diff --cached --check
          git commit -m "FIX TRX canonical from Minutes Daily Recap"
          git push origin HEAD:main
