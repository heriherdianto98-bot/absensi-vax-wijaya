name: Provider Contact Sync Dry Run

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/provider-contact-dry-run.yml"

concurrency:
  group: erp-vax-provider-contact-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_erp_vax_contact
          chmod 600 ~/.ssh/id_erp_vax_contact
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload isolated contact script only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          rsync -az -e "ssh -i ~/.ssh/id_erp_vax_contact" \
            minutes-connector/provider-contact-sync.js \
            "$VPS_USER@$VPS_HOST:/var/www/absensi-vax-wijaya/minutes-connector/"

      - name: Run provider contact DRY RUN on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_erp_vax_contact "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /var/www/absensi-vax-wijaya/minutes-connector
          LIVE_JSON=/tmp/provider-contact-master-live.json
          RESULT_JSON=/tmp/provider-contact-sync-result.json

          # Locked provider audit is reused READ ONLY; its source file is not modified.
          node provider-master-audit.js --out="$LIVE_JSON"

          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/provider-contact-master-live.json','utf8'));
          if (!j.audit_read_only) throw new Error('audit_read_only marker missing');
          if (Number(j.summary?.errors||0)!==0) throw new Error(`provider audit errors=${j.summary.errors}`);
          if (Number(j.summary?.branches||0)!==10) throw new Error(`expected 10 branches, got ${j.summary?.branches}`);
          console.log(`CONTACT_AUDIT_GATE_PASS branches=${j.summary.branches} providers=${j.summary.providers}`);
          NODE

          # IMPORTANT: no --apply => guaranteed DRY RUN path.
          node provider-contact-sync.js --input="$LIVE_JSON" --out="$RESULT_JSON"

          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/provider-contact-sync-result.json','utf8'));
          console.log('CONTACT_DRY_RUN_SUMMARY='+JSON.stringify(j.summary||{}));
          for (const r of (j.rows||[]).filter(x=>['READY_TO_FILL','ERP_PHONE_PRESERVED','MINUTES_PHONE_EMPTY','DETAIL_ERROR'].includes(x.status))) {
            console.log(JSON.stringify({employee_id:r.employee_id,nama_erp:r.nama_erp,nama_minutes:r.nama_minutes,cabang_id:r.cabang_id,status:r.status,phone_minutes:r.phone_minutes,phone_erp_before:r.phone_erp_before,detail_error:r.detail_error}));
          }
          if (j.summary?.mode !== 'DRY_RUN') throw new Error('unexpected mode: '+j.summary?.mode);
          if (Number(j.summary?.applied||0)!==0) throw new Error('dry run applied rows unexpectedly');
          NODE
          REMOTE
