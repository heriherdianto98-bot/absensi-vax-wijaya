name: Backfill Provider Product Aug 2026

on:
  workflow_run:
    workflows: ["Deploy ERP VAX to VPS"]
    types: [completed]

jobs:
  backfill:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_erp_vax_deploy
          chmod 600 ~/.ssh/id_erp_vax_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Backfill provider product share 14-31 Aug 2026
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -i "$HOME/.ssh/id_erp_vax_deploy" "$VPS_USER@$VPS_HOST" \
            'cd /var/www/absensi-vax-wijaya/minutes-connector && node provider-product-sales-backfill.js 2026-08-14 2026-08-31'
