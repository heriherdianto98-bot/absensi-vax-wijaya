<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Riwayat Absensi | VAX WIJAYA</title>
<link rel="stylesheet" href="riwayat.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="app">

    <header class="page-head">
        <div class="page-head-top">
            <small>VAX WIJAYA</small>
            <span>BULAN INI</span>
        </div>
        <h1>Riwayat Absensi</h1>
        <p id="namaRiwayat">Loading...</p>
    </header>

    <section class="filter-card" aria-label="Filter tanggal">
        <label class="filter-label" for="filterTanggal">Filter tanggal</label>
        <div class="filter-bar">
            <div class="date-field" id="dateField">
                <i class="fas fa-calendar-days" aria-hidden="true"></i>
                <span class="date-placeholder" id="datePlaceholder">Semua tanggal</span>
                <input type="date" id="filterTanggal" aria-label="Pilih tanggal riwayat" autocomplete="off">
            </div>
            <button type="button" id="resetFilter">Reset</button>
        </div>
    </section>

    <p id="riwayatMeta" class="riwayat-meta">Memuat riwayat...</p>
    <div id="listRiwayat" class="riwayat-list"></div>

    <nav id="bottomNav" aria-label="Navigasi Karyawan">
        <a href="dashboard-karyawan.html">
            <i class="fas fa-house"></i>
            <span>Dashboard</span>
        </a>
        <a href="absensi.html">
            <i class="fas fa-fingerprint"></i>
            <span>Absensi</span>
        </a>
        <a href="gaji-saya.html">
            <i class="fas fa-file-invoice"></i>
            <span>Gaji Saya</span>
        </a>
        <a href="profil.html">
            <i class="fas fa-user"></i>
            <span>Profil</span>
        </a>
    </nav>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="karyawan-session.js"></script>
<script src="riwayat.js"></script>

</body>
</html>
