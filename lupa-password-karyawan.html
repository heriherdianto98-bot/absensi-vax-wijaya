<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pemulihan Password Karyawan | VAX WIJAYA</title><style>*{box-sizing:border-box}body{margin:0;background:#080909;color:#f4eee2;font:15px/1.5 system-ui,sans-serif;padding:25px 15px}main{max-width:440px;margin:3vh auto;background:#1a1b19;border:1px solid #9c7d35;padding:22px;border-radius:17px}h1{font-size:23px;color:#ffdf88}h2{font-size:18px;color:#ffdf88;margin-top:22px}p{color:#c9c2b1}input{display:block;width:100%;padding:12px;border-radius:9px;border:1px solid #826a38;background:#090b0b;color:white;margin:8px 0 12px;font:inherit}button{display:block;width:100%;padding:13px;background:#edc459;border:0;border-radius:9px;font-weight:800;cursor:pointer}button:disabled{opacity:.6}a{color:#ffdf88}#status,#resetStatus{white-space:pre-wrap;margin-top:12px}label{font-size:13px;font-weight:700}</style></head><body><main><h1>Pemulihan Password Karyawan</h1><p>Hanya untuk email pribadi yang sudah diverifikasi dan akun karyawan aktif. Jika email belum diverifikasi, hubungi Owner untuk reset sementara.</p><form id="request"><label>Email terverifikasi<input id="email" type="email" autocomplete="email" required maxlength="254" placeholder="nama@email.com"></label><button type="submit" id="send">Kirim Tautan Pemulihan</button><p id="status" role="status"></p></form><form id="reset"><h2>Buat Password Baru</h2><label>Kode dari email<input id="token" required maxlength="64" autocomplete="off" spellcheck="false" placeholder="Tempel kode pemulihan"></label><label>Password baru (minimal 12 karakter)<input id="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><label>Konfirmasi password<input id="confirm" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><button type="submit" id="change">Ganti Password</button><p id="resetStatus" role="status"></p></form><p><a href="ERP.NEW/pages/login.html">Kembali ke Login</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const match=location.hash.match(/(?:^#|&)token=([a-f0-9]{64})(?:&|$)/);if(match){$('token').value=match[1];history.replaceState(null,'',location.pathname+location.search);} $('request').addEventListener('submit',async e=>{e.preventDefault();$('send').disabled=true;$('status').textContent='Memproses…';try{const {data,error}=await db.functions.invoke('karyawan-email-auth',{body:{purpose:'RESET',email:$('email').value.trim()}});if(error||!data?.ok)throw Error(data?.reason==='MAIL_NOT_CONFIGURED'?'Layanan email belum dikonfigurasi. Hubungi Owner.':data?.reason==='MAIL_DELIVERY_FAILED'?'Pengiriman email gagal. Coba lagi nanti.':'Layanan pemulihan belum tersedia.');$('status').textContent='Jika email terverifikasi dan akun aktif, instruksi akan dikirim. Periksa inbox dan spam.'}catch(err){$('status').textContent=err.message||'Permintaan gagal.'}finally{$('send').disabled=false}});$('reset').addEventListener('submit',async e=>{e.preventDefault();const p=$('password').value;if(p!==$('confirm').value){$('resetStatus').textContent='Konfirmasi password tidak sama.';return}if(p.length<12){$('resetStatus').textContent='Password minimal 12 karakter.';return}$('change').disabled=true;$('resetStatus').textContent='Memeriksa kode…';try{const {data,error}=await db.rpc('karyawan_email_reset_password_v1',{p_token:$('token').value.trim().toLowerCase(),p_new_password:p});if(error||data?.ok!==true)throw Error(data?.reason==='PASSWORD_INVALID'?'Password harus berbeda dari password awal dan minimal 12 karakter.':'Kode sudah tidak berlaku atau akun tidak aktif.');$('token').value='';$('password').value='';$('confirm').value='';$('resetStatus').textContent='Password berhasil diganti. Semua sesi lama dicabut. Silakan login ulang dengan kode Kxxxx atau email terverifikasi.'}catch(err){$('resetStatus').textContent=err.message||'Gagal mengganti password.'}finally{$('change').disabled=false}})})();</script></body></html>
