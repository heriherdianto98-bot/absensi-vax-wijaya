<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pengumuman | VAX WIJAYA</title>
    <link rel="stylesheet" href="pengumuman.css?v=20260817t9">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<div class="app">
    <header class="topbar">
        <a href="dashboard-karyawan.html" class="back-btn" id="btnBack" aria-label="Kembali"><i class="fa-solid fa-chevron-left"></i></a>
        <div class="topbar-title">
            <strong id="pageTitle">PENGUMUMAN</strong>
            <small>VAX WIJAYA</small>
        </div>
        <button type="button" class="icon-btn" id="btnRefresh" aria-label="Muat ulang"><i class="fa-solid fa-rotate"></i></button>
    </header>

    <main class="pg-body" id="listView">
        <p id="listMeta" class="pg-meta">Memuat pengumuman...</p>
        <div id="listEmpty" class="pg-empty" hidden>
            <i class="fa-solid fa-bullhorn"></i>
            <span>Belum ada pengumuman.</span>
        </div>
        <div id="listPengumuman" class="pg-list"></div>
    </main>

    <section class="pg-detail" id="detailView" hidden>
        <div class="detail-story" id="detailScroll">
            <div class="detail-head">
                <div class="detail-head-row">
                    <span id="detailPrioritas" class="pri-badge pri-normal">Normal</span>
                    <span id="detailUnread" class="read-dot" hidden>Belum dibaca</span>
                </div>
                <h1 id="detailJudul">â€”</h1>
                <p id="detailMeta" class="detail-meta">â€”</p>
            </div>
            <article class="detail-body" id="detailIsi"></article>
            <div class="photo-gallery" id="detailPhotos" hidden></div>
        </div>
        <div class="thread-wrap">
            <h2>Percakapan</h2>
            <div id="threadEmpty" class="thread-empty">Belum ada pesan.</div>
            <div id="threadList" class="thread-list"></div>
        </div>
        <p id="diskusiClosed" class="diskusi-closed" hidden>Diskusi telah ditutup</p>
        <form class="composer" id="composerForm" autocomplete="off">
            <input id="replyInput" type="text" maxlength="500" placeholder="Tulis pesan..." aria-label="Pesan">
            <button type="submit" id="btnKirim" aria-label="Kirim"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
        <p id="detailMessage" class="form-message" aria-live="polite"></p>
    </section>
</div>

<nav id="bottomNav" aria-label="Navigasi Karyawan">
    <a href="dashboard-karyawan.html"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
    <a href="absensi.html"><i class="fa-solid fa-fingerprint"></i><span>Absensi</span></a>
    <a href="gaji-saya.html"><i class="fa-solid fa-file-invoice"></i><span>Gaji Saya</span></a>
    <a href="profil.html"><i class="fa-solid fa-user"></i><span>Profil</span></a>
</nav>

<div id="photoLightbox" class="lightbox" hidden>
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Tutup"><i class="fa-solid fa-xmark"></i></button>
    <img id="lightboxImg" alt="Foto pengumuman">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="karyawan-session.js"></script>
<script src="pengumuman.js?v=20260817t9"></script>
</body>
</html>
