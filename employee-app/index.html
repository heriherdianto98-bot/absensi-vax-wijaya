<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#27bda9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Pasang Portal Karyawan | VAX WIJAYA</title>
  <link rel="manifest" href="/employee-app/manifest.json">
  <link rel="icon" href="/employee-app/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/employee-app/icon-192.png">
  <style>
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{display:grid;place-items:center;padding:24px 18px;background:linear-gradient(160deg,#eaf5f3,#f9fdfc);color:#173f47;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,420px);padding:28px 22px;border:1px solid #b5ddd7;border-radius:24px;background:#fff;box-shadow:0 16px 40px #1c736923;text-align:center}
    img{width:96px;height:96px;border-radius:22px}
    h1{margin:16px 0 7px;font-size:23px;line-height:1.2}
    p{margin:0 0 18px;color:#56747a}
    button,a.action{display:block;width:100%;min-height:48px;padding:12px;border:0;border-radius:12px;background:#20b39f;color:#fff;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
    a.action{margin-top:10px;background:#eaf8f5;color:#167b70}
    button[hidden]{display:none}
    .hint{margin:18px 0 0;font-size:13px;color:#607c80}
    .status{min-height:20px;margin-top:15px;color:#167b70;font-size:13px}
  </style>
  <script src="/employee-app/install.js" defer></script>
</head>
<body>
  <main>
    <img src="/employee-app/icon-192.png" alt="VAX WIJAYA">
    <h1>VAX WIJAYA Karyawan</h1>
    <p>Pasang portal di layar utama HP untuk membukanya seperti aplikasi.</p>
    <button id="installButton" type="button" hidden>Pasang Aplikasi</button>
    <a class="action" href="/dashboard-karyawan.html">Buka Portal</a>
    <p id="installHint" class="hint">Di Chrome, buka menu ⋮ lalu pilih <strong>Instal aplikasi</strong> atau <strong>Tambahkan ke layar utama</strong>.</p>
    <div id="installStatus" class="status" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
