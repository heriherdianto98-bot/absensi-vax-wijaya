# ERP VAX — Owner -> SVP Invoice API
# Include this location inside the existing erp-test.vaxwijaya.com server block.
location = /api/svp-invoice/send {
    proxy_pass http://127.0.0.1:8791/api/svp-invoice/send;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
}

location = /api/svp-invoice/health {
    proxy_pass http://127.0.0.1:8791/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
