# Add inside HTTPS server blocks for erp.vaxwijaya.com and erp-test.vaxwijaya.com.
location = /api/ranking-award/push-config {
    proxy_pass http://127.0.0.1:8796/api/ranking-award/push-config;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/ranking-award/health {
    proxy_pass http://127.0.0.1:8796/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
