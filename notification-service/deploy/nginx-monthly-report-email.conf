# Tambahkan secara selektif ke server block ERP yang aktif. Jangan ubah route existing.
location = /api/monthly-report/email-svp {
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:8795/api/monthly-report/email-svp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 10s;
    proxy_read_timeout 90s;
}
location = /api/monthly-report/health {
    proxy_pass http://127.0.0.1:8795/health;
    proxy_set_header Host $host;
}
