<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi Vax Wijaya</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0d0d0d,#1d1d1d);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.title{
    text-align:center;
    color:#d4af37;
    font-size:30px;
    font-weight:700;
    letter-spacing:2px;
    margin-bottom:2px;
}

.subtitle{
    text-align:center;
    color:#9e9e9e;
    font-size:15px;
    margin-bottom:8px;
}
.quoteTitle{
    text-align:center;
    color:#d4af37;
    font-size:13px;
    font-weight:600;
    letter-spacing:1px;
    margin-bottom:8px;
}
.quote{
    text-align:center;
    color:#f5f5f5;
    font-size:16px;
    font-style:italic;
    line-height:1.5;
    min-height:40px;
    margin-top:5px;
    margin-bottom:12px;
}
.card{
    background:#202020;
    border-radius:20px;
    padding:25px;
    border:1px solid #333;
}

.date{
    text-align:center;
    color:#aaa;
    margin-bottom:5px;
}

.clock{
    text-align:center;
    font-size:50px;
    font-weight:bold;
    color:#d4af37;
    margin-bottom:25px;
}

.label{
    color:#888;
    font-size:13px;
    margin-bottom:6px;
}

.box{
    background:#2d2d2d;
    padding:16px;
    border-radius:12px;
    margin-bottom:18px;
}

.status{
    background:#3a321d;
    color:#f4d36a;
    padding:14px;
    text-align:center;
    border-radius:12px;
    margin-bottom:20px;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btnMasuk{
    background:#d4af37;
    color:#111;
    margin-bottom:12px;
}

.btnPulang{
    background:#3a3a3a;
    color:#fff;
}
#btnRiwayat{
    width:100%;
    padding:16px;
    margin-top:10px;
    background:#2b2b2b;
    color:#fff;
    border:1px solid #444;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

#btnRiwayat:hover{
    background:#d4af37;
    color:#111;
}
.footer{
    margin-top:20px;
    text-align:center;
    color:#666;
    font-size:12px;
}
#jenisAbsen{
    width:100%;
    padding:14px;
    background:#2b2b2b;
    color:#fff;
    border:1px solid #444;
    border-radius:12px;
    font-size:18px;
    margin-bottom:15px;
}
#jenisAbsen option{
    background:#2b2b2b;
    color:#fff;
}
</style>

</head>

<body>

<div class="container">

    <h1 class="title">VAX WIJAYA BARBERSHOP</h1>
<p class="subtitle">Attendance System</p>

<div class="quoteTitle">
    🔥 Motivasi Hari Ini
</div>

<div id="quote" class="quote"></div>

<div class="card">

<div class="date" id="tanggal"></div>

<div class="clock" id="jam"></div>

<div class="label">Karyawan</div>
<div class="box">

    <select id="karyawan" style="
        width:100%;
        background:#2d2d2d;
        color:white;
        border:none;
        outline:none;
        font-size:18px;
        padding:5px;
    ">
        <option>Memuat data...</option>
    </select>
    
    </div>
    <div class="label">Cabang</div>

    <div class="box">
        <select id="cabang" style="
            width:100%;
            background:#2d2d2d;
            color:white;
            border:none;
            outline:none;
            font-size:18px;
            padding:5px;
        ">
            <option>Memuat data...</option>
        </select>
    </div>
    <div class="label">PIN</div>

    <div class="box">
        <input
            type="password"
            id="pin"
            placeholder="Masukkan PIN"
            maxlength="6"
            style="
                width:100%;
                background:#2d2d2d;
                color:white;
                border:none;
                outline:none;
                font-size:18px;
                padding:5px;
            "
        >
    </div>
<div class="status" id="status"></div>



<button id="btnAbsen">
    PROSES ABSEN
</button>

<button id="btnRiwayat">
    RIWAYAT ABSENSI
</button>

</div>

<div class="footer">
VAX WIJAYA BARBERSHOP • ATTENDANCE SYSTEM
</div>

</div>

<script>

const quotes = [
    "😂 Tong loba scrolling, gunting leuwih penting.",
    "💰 Hayu neangan rejeki, lain neangan alesan.",
    "💪 Jam teu pernah telat, urang oge ulah.",
    "😄 Tong sieun capé, sieun mah teu boga duit.",
    "💈 Hasil cukuran rapih, pelanggan balik deui.",
    "☕ Kopi bisa tiis, semangat ulah.",
    "🔥 Kerja keras ti ayeuna, hasilna keur engké.",
    "😁 Nu datang tiheula lain jodo, tapi pelanggan.",
    "💸 Dompét keur ngadagoan dieusian, hayu ah gawe.",
    "🤝 Kudu saling bantu, gawé jadi leuwih hampang."
];

document.getElementById("quote").innerHTML =
    quotes[Math.floor(Math.random() * quotes.length)];

    function updateJam() {
    
        const now = new Date();
    
        document.getElementById("jam").innerHTML =
            now.toLocaleTimeString("id-ID");
    
        document.getElementById("tanggal").innerHTML =
            now.toLocaleDateString("id-ID", {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            });
    
    }
    
    updateJam();
    
    setInterval(updateJam, 1000);
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="supabase.js"></script>
    </body>
    </html>
