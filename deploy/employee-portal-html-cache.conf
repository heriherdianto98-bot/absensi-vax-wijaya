# Employee portal HTML cache policy.
# Place this location inside the HTTPS server for karyawan.vaxwijaya.com.
# HTML is revalidated on each navigation so phone browsers receive new deploys.
# Keep this scoped to the employee portal; do not edit ERP Owner server blocks.
#
# Note: nginx add_header in a location can override add_header directives inherited
# from the server block. If security headers are enabled at server level later,
# include them in this location as well.

location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
}
