# ERP VAX Employee Portal — production security headers.
# Include ONLY inside the HTTPS server block serving the employee portal.
# This file is intentionally non-breaking for the current frontend.
#
# NOTE:
# - HSTS max-age starts conservative (1 day). Raise only after HTTPS is verified.
# - CSP is NOT enforced here yet because the current portal still uses inline styles/scripts
#   and third-party CDN assets. Audit CSP separately before enforcement.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=86400" always;

# Keep server version disclosure off in nginx http/server context:
# server_tokens off;
