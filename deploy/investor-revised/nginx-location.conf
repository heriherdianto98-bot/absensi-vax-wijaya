# ERP VAX Investor Revised API — isolated route only.
# Add inside the existing HTTPS server block for erp.vaxwijaya.com AFTER local service 127.0.0.1:8788 passes health check.
location ^~ /api/investor-revised/ {
    proxy_pass http://127.0.0.1:8788/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 370s;
    proxy_send_timeout 370s;
}
