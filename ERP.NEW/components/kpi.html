<div class="kpi-grid">

    <!-- AVG TICKET -->
    <div class="kpi-card gold">

        <div class="kpi-top">
            <span class="kpi-label">AVG TICKET</span>
            <i class="fa-solid fa-ticket kpi-icon"></i>
        </div>

        <div class="kpi-value" id="kpiAvgTicket">
            Rp0
        </div>

        <div class="kpi-bottom">
            <span class="kpi-status positive">▲ 0%</span>
            <span class="kpi-desc">vs periode sebelumnya</span>
        </div>

    </div>

    <!-- TARGET BULAN -->
    <div class="kpi-card emerald">

        <div class="kpi-top">
            <span class="kpi-label">TARGET BULAN</span>
            <i class="fa-solid fa-bullseye kpi-icon"></i>
        </div>

        <div class="kpi-value" id="kpiTarget">
            0%
        </div>
        <div class="target-progress">
            <div class="target-fill" id="kpiTargetBar" style="width:68%"></div>
        </div>

        <div class="kpi-bottom">
            <span class="kpi-status">
                Rp0 / Rp0
            </span>
        </div>

        

    </div>

    <!-- GROWTH -->

            +0%

        <div class="kpi-bottom">
            <span class="kpi-status positive">
                ▲ 0%
            </span>
            <span class="kpi-desc">
                vs periode sebelumnya
            </span>
        </div>

    </div>

            <span class="kpi-status">

            <span class="kpi-desc">

        </div>

    </div>
