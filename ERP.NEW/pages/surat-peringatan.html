<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surat Peringatan | VAX WIJAYA</title><link rel="stylesheet" href="../../vax-sp.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body><main class="sp-shell"><header class="sp-header"><a href="pesan-karyawan.html" aria-label="Kembali ke Inbox">‹</a><div><h1>Surat Peringatan</h1><small>OWNER ONLY · SP1 / SP2 / SP3</small></div></header><section class="sp-card"><h2>Buat draf surat</h2><p class="sp-help">Hanya Owner dapat menerbitkan. Draf tidak dikirim ke karyawan.</p><form id="spForm"><label>Karyawan<select id="spEmployee" required><option value="">Memuat karyawan…</option></select></label><label>Tingkat<select id="spLevel"><option value="1">SP1</option><option value="2">SP2</option><option value="3">SP3</option></select></label><label>Uraian pelanggaran<textarea id="spViolation" minlength="12" maxlength="4000" required placeholder="Jelaskan kejadian dan bukti secara faktual"></textarea></label><label>Perbaikan yang diwajibkan<textarea id="spImprovement" minlength="12" maxlength="4000" required placeholder="Jelaskan tindakan perbaikan dan standar evaluasi"></textarea></label><div class="sp-two"><label>Tenggat evaluasi<input id="spDeadline" type="date" required></label><label>Berlaku sampai<input id="spExpiry" type="date" required></label></div><button type="submit">Simpan draf</button></form></section><section class="sp-card"><div class="sp-line"><h2>Riwayat surat</h2><button type="button" id="spReload" class="secondary">Refresh</button></div><div id="spList" aria-live="polite">Memuat…</div></section><section id="spDetail" class="sp-card" hidden><div class="sp-line"><h2>Detail surat</h2><button id="spPrint" type="button" class="secondary">Cetak / Simpan PDF</button></div><article id="spDocument" class="sp-document"></article><div id="spAttachment" class="sp-warn" hidden><label>Dokumen lampiran privat (PDF, DOC, DOCX, maksimal 8 MB)<input type="file" id="spUploadFile" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></label><button type="button" id="spUploadBtn">Unggah ke draf</button><p id="spFileStatus"></p><button type="button" id="spDownloadBtn" class="secondary" hidden>Unduh lampiran</button></div><div id="spActions" class="sp-actions"></div></section><p id="spStatus" role="status" aria-live="polite"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config/minutes.js"></script><script src="../js/modules/connector.js"></script><script src="../js/modules/owner-auth.js"></script><script src="../../vax-sp-owner.js?v=20260923-1"></script><script src="../../vax-sp-file-owner.js?v=20260923-1"></script></body></html>
