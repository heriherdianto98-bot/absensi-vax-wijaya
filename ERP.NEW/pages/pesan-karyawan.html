<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pesan Karyawan | VAX ERP</title><link rel="stylesheet" href="../../vax-inbox.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body data-inbox-mode="staff"><main class="inbox-shell"><header class="inbox-header"><a class="inbox-back" href="erp-dashboard.html" aria-label="Kembali ke ERP">‹</a><div><h1>Inbox Karyawan</h1><small>OWNER / SPV · PESAN INTERNAL</small></div><button id="inboxRefresh" class="inbox-refresh" type="button" aria-label="Refresh pesan"><i class="fa-solid fa-rotate-right"></i></button></header><div id="inboxListView" class="inbox-list-view"><div class="inbox-controls"><button id="inboxTabChats" type="button" aria-pressed="true">Percakapan</button><button id="inboxTabContacts" type="button" aria-pressed="false">Kirim ke Karyawan</button></div><p id="inboxHelp" class="inbox-status">Owner dan SPV dapat memulai percakapan dengan karyawan. SP1 formal tetap dicatat di modul kepegawaian, bukan chat biasa.</p><input id="inboxSearch" class="inbox-search" type="search" placeholder="Cari nama, cabang, atau jabatan" aria-label="Cari karyawan"><section id="inboxList" class="inbox-list" aria-live="polite"><p class="inbox-empty">Memuat inbox…</p></section></div><section id="inboxThread" class="inbox-thread" hidden><header class="inbox-thread-header"><button id="inboxThreadBack" type="button" aria-label="Kembali">‹</button><div><strong id="inboxThreadName">—</strong><small id="inboxThreadMeta">—</small></div></header><div id="inboxMessages" class="inbox-messages" aria-live="polite"></div><form id="inboxForm" class="inbox-form"><textarea id="inboxText" maxlength="3000" rows="2" placeholder="Tulis pesan…" aria-label="Tulis pesan" required></textarea><button type="submit" aria-label="Kirim pesan"><i class="fa-solid fa-paper-plane"></i></button></form><p id="inboxThreadStatus" class="inbox-status" role="status"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config/minutes.js"></script><script src="../js/modules/connector.js"></script><script src="../js/modules/owner-auth.js"></script><script src="../../vax-inbox.js?v=20260923-1"></script></body></html>
