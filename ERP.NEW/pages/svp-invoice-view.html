<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Invoice SVP | VAX ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#172233;font-family:'Source Sans 3',Arial,sans-serif}.wrap{max-width:820px;margin:28px auto;padding:0 14px}.doc{background:#fff;border:1px solid #c9d0d8;box-shadow:0 12px 35px rgba(22,34,51,.08)}.head{padding:22px 26px;border-top:5px solid #b88a19;border-bottom:1px solid #d8dde2}.brand{font-family:Georgia,'Times New Roman',serif;font-size:27px;font-weight:700;color:#163e86;letter-spacing:.5px}.tag{margin-top:5px;font-size:12px;font-weight:900;letter-spacing:2px}.sub{margin-top:3px;font-size:10px;color:#6e7884;letter-spacing:1px}.body{padding:22px 26px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 16px;background:#f5f7f9;border-left:4px solid #b88a19;margin-bottom:18px}.meta div:nth-child(even){text-align:right}.label{font-size:10px;font-weight:800;color:#6a7580;text-transform:uppercase;letter-spacing:.8px}.value{font-size:13px;font-weight:700;margin-top:2px}.status{display:inline-block;padding:3px 8px;border-radius:999px;background:#e8eef3;font-size:10px;font-weight:900;letter-spacing:.5px}.status.sent{background:#e3f4ff;color:#17618a}.status.paid{background:#e3f7ea;color:#246d43}table{width:100%;border-collapse:collapse}th,td{border:1px solid #d7dce1;padding:9px 10px;font-size:12px}th{background:#eef1f4;text-align:left}.num{text-align:center;width:48px}.right{text-align:right}.total{display:flex;justify-content:space-between;align-items:end;margin-top:14px;padding-top:13px;border-top:2px solid #172233}.total span{font-size:11px;color:#6a7580}.total strong{font-size:25px;color:#163e86}.note{margin-top:15px;padding:10px 12px;background:#f7f8fa;border-left:3px solid #c9ced4;font-size:11px;color:#5f6a75;white-space:pre-wrap}.foot{display:flex;justify-content:space-between;padding:12px 26px;border-top:1px solid #d4d9df;background:#f6f7f9;font-size:9px;color:#7a8490}.state{padding:40px 26px;text-align:center;font-size:13px}.state b{display:block;margin-bottom:5px;color:#172233}.login{display:inline-block;margin-top:12px;padding:9px 14px;border:1px solid #b88a19;background:#fff8df;color:#6c5010;text-decoration:none;font-weight:800}@media(max-width:600px){.wrap{margin:10px auto}.head,.body,.foot{padding-left:16px;padding-right:16px}.meta{grid-template-columns:1fr}.meta div:nth-child(even){text-align:left}.brand{font-size:23px}.total strong{font-size:21px}}
</style>
</head>
<body>
<div class="wrap"><section class="doc" id="invoiceDoc"><div class="state">Memuat invoice...</div></section></div>
<script src="./config/minutes.js"></script>
<script src="./js/modules/connector.js"></script>
<script>
'use strict';
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':'&quot;'}[c]));
const rp=v=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(v||0));
const fmtDate=v=>{if(!v)return '—';const d=new Date(String(v).slice(0,10)+'T00:00:00');return Number.isNaN(d.getTime())?String(v):new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'long',year:'numeric'}).format(d)};
const doc=document.getElementById('invoiceDoc');
function state(title,text,login=false){doc.innerHTML=`<div class="state"><b>${esc(title)}</b>${esc(text||'')}${login?'<br><a class="login" href="./pages/login.html">Login ERP VAX</a>':''}</div>`}
(async()=>{
  const id=new URLSearchParams(location.search).get('id');
  if(!id){state('Invoice tidak ditemukan','ID invoice tidak tersedia.');return}
  const {data:s}=await db.auth.getSession();const user=s?.session?.user;
  if(!user){state('Akses diperlukan','Silakan login sebagai Owner atau SVP untuk melihat invoice.',true);return}
  const {data:p,error:pe}=await db.from('profiles').select('role,aktif').eq('id',user.id).maybeSingle();
  if(pe||!p||p.aktif===false){state('Akses ditolak','Profil ERP tidak aktif atau tidak dapat dibaca.');return}
  let role=String(p.role||'').toLowerCase();if(role==='spv')role='svp';
  if(!['owner','svp'].includes(role)){state('Akses ditolak','Invoice hanya dapat dilihat oleh Owner atau SVP.');return}
  const [{data:inv,error:ie},{data:items,error:xe}]=await Promise.all([
    db.from('svp_invoices').select('*').eq('id',id).maybeSingle(),
    db.from('svp_invoice_items').select('*').eq('invoice_id',id).order('sort_order')
  ]);
  if(ie||!inv){state('Invoice tidak ditemukan',ie?.message||'Data invoice tidak tersedia.');return}
  if(xe){state('Gagal memuat detail',xe.message);return}
  const rows=(items||[]).map((x,i)=>`<tr><td class="num">${i+1}</td><td>${esc(x.item_name||'')}</td><td class="num">${Number(x.qty||0)}</td><td class="right">${rp(x.unit_price)}</td><td class="right"><b>${rp(x.amount)}</b></td></tr>`).join('');
  const st=String(inv.status||'draft').toLowerCase();
  doc.innerHTML=`<div class="head"><div class="brand">ERP VAX WIJAYA</div><div class="tag">${esc(inv.title||'INVOICE SVP')}</div><div class="sub">ENTERPRISE MANAGEMENT SYSTEM</div></div><div class="body"><div class="meta"><div><div class="label">No. Invoice</div><div class="value">${esc(inv.invoice_no)}</div></div><div><div class="label">Status</div><div class="value"><span class="status ${st}">${esc(st.toUpperCase())}</span></div></div><div><div class="label">Kepada</div><div class="value">SVP VAX WIJAYA</div></div><div><div class="label">Tanggal Invoice</div><div class="value">${esc(fmtDate(inv.invoice_date))}</div></div><div><div class="label">Jatuh Tempo</div><div class="value">${esc(fmtDate(inv.due_date))}</div></div></div><table><thead><tr><th class="num">No</th><th>Daftar Tagihan</th><th class="num">Qty</th><th class="right">Nominal</th><th class="right">Jumlah</th></tr></thead><tbody>${rows||'<tr><td colspan="5">Tidak ada item.</td></tr>'}</tbody></table><div class="total"><span>TOTAL INVOICE</span><strong>${rp(inv.total)}</strong></div>${inv.notes?`<div class="note">${esc(inv.notes)}</div>`:''}</div><div class="foot"><span>ERP VAX WIJAYA • INTERNAL</span><span>Invoice read-only</span></div>`;
})().catch(e=>state('Gagal memuat invoice',e?.message||String(e)));
</script>
</body>
</html>
