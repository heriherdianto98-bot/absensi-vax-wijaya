<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifikasi Email | VAX WIJAYA</title><style>*{box-sizing:border-box}body{margin:0;background:#080909;color:#f4eee2;font:15px/1.5 system-ui,sans-serif;padding:25px 15px}main{max-width:440px;margin:6vh auto;background:#1a1b19;border:1px solid #9c7d35;padding:22px;border-radius:17px}h1{font-size:23px;color:#ffdf88}p{color:#c9c2b1}input{display:block;width:100%;padding:12px;border-radius:9px;border:1px solid #826a38;background:#090b0b;color:white;margin:12px 0;font:inherit}button{display:block;width:100%;padding:13px;background:#edc459;border:0;border-radius:9px;font-weight:800;cursor:pointer}a{color:#ffdf88}#status{white-space:pre-wrap;margin-top:14px}</style></head><body><main><h1>Verifikasi Email Karyawan</h1><p>Kode berlaku 20 menit dan hanya dapat digunakan sekali. Jangan membagikannya.</p><label for="token">Kode verifikasi dari email</label><input id="token" autocomplete="off" spellcheck="false" maxlength="64" placeholder="Tempel kode verifikasi"><button type="button" id="confirm">Verifikasi Email</button><p id="status" role="status"></p><p><a href="profil.html">Kembali ke Profil</a> · <a href="ERP.NEW/pages/login.html">Login</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
(()=>{'use strict';const token=document.getElementById('token'),status=document.getElementById('status'),button=document.getElementById('confirm');const match=location.hash.match(/(?:^#|&)token=([a-f0-9]{64})(?:&|$)/);if(match){token.value=match[1];history.replaceState(null,'',location.pathname+location.search);}async function verify(){const value=token.value.trim().toLowerCase();if(!/^[a-f0-9]{64}$/.test(value)){status.textContent='Kode verifikasi harus 64 karakter dari email.';return}button.disabled=true;status.textContent='Memeriksa kode…';try{const {data,error}=await db.rpc('karyawan_email_confirm_v1',{p_token:value});if(error||data?.ok!==true)throw Error(data?.reason==='EMAIL_CHANGED_OR_INACTIVE'?'Email sudah berubah atau akun tidak aktif.':'Kode sudah tidak berlaku atau tidak cocok.');token.value='';status.textContent='Email berhasil diverifikasi. Sekarang dapat digunakan untuk login dan pemulihan password.';}catch(e){status.textContent=e.message||'Verifikasi gagal.'}finally{button.disabled=false}}button.addEventListener('click',verify);if(match)verify();})();</script></body></html>
